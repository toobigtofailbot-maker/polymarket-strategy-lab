name: Analytical Research + Offline Kernel + Market Truth + Experiment OS CI

# Hosted compatibility evidence only. No secrets, no product API, no external
# archive download, no trading. This workflow proves the exact WP167 dependency
# pins plus the WP168 nautilus_trader pin install and behave identically across the
# supported Windows/Linux targets, and it is the authoritative environment for the
# DuckDB-dependent tests, compiled NautilusTrader offline path, and WP170 local
# experiment-control registry on the exact supported host matrix. The native modules cannot
# run on developer machines where the native module is blocked (Windows Smart App
# Control) or where an over-long local path trips the Windows MAX_PATH limit.

# S10-CI-OPT-01 local-first scheduling: hosted CI is final exact-head verification,
# not the iterative development loop. Every job is skipped while the pull request is a
# draft; marking it Ready for review (or pushing a new head while non-draft) launches the
# complete unchanged matrix on that exact head. The duplicate post-merge push-to-main run
# is removed because the final non-draft PR head carries the authoritative evidence.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Same-PR concurrency: a newer eligible head cancels a stale in-progress run.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Exact WP167 direct runtime dependency pins.
  WP167_DEPS: "pyarrow==25.0.1 duckdb==1.5.5 polars==1.44.1"
  # Exact WP168 direct runtime dependency pin (base install: no polymarket extra, no redis).
  WP168_DEP: "nautilus_trader==1.231.0"
  # WP174's exact official SDK pin and compatible WP169 WebSocket pin.
  WP174_DEPS: "polymarket-client==0.10.0 websockets==15.0.1"
  # WP171 optional local cockpit pins (loopback/read-only, no product network).
  WP171_DEPS: "fastapi==0.141.1 uvicorn==0.52.4"
  # S10-NDFD-GRIB-01 optional `ndfd-grib` extra is read from pyproject.toml by the
  # dedicated ndfd-grib-* jobs (Python 3.12 only); the general matrix does not install it.
  # Strict DuckDB mode: DuckDB-dependent tests must execute; any import failure or
  # skip in a required hosted job fails the job rather than producing green CI.
  WP167_STRICT_DUCKDB: "1"

jobs:
  compatibility:
    name: compat (${{ matrix.os }} / py${{ matrix.python }})
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.12", "3.14"]
    steps:
      - name: Normalize line endings before checkout
        # `.gitattributes` marks files `text=auto`, which checks out with the
        # platform-native EOL (CRLF on Windows) unless core.eol is pinned. Force LF
        # on every runner so line-ending-sensitive byte-hash tests (e.g. the WP159
        # package hashes) see identical bytes on Windows and Linux.
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for repository scope guards
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install exact dependency pins and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install $WP167_DEPS $WP168_DEP $WP174_DEPS $WP171_DEPS "pytest>=8.0"

      - name: pip check
        run: python -m pip check

      - name: Assert exact direct dependency versions and Python floor
        run: python -m pytest -q tests/data_layer/analytical_research/test_dependency_runtime_compatibility.py

      - name: Assert exact NautilusTrader pin and import offline modules
        run: |
          python -c "import importlib.metadata as m; assert m.version('nautilus_trader') == '1.231.0', m.version('nautilus_trader')"
          python -c "import nautilus_trader.model.instruments, nautilus_trader.model.data, nautilus_trader.persistence.catalog.parquet, nautilus_trader.backtest.engine; print('nautilus offline modules import OK')"

      - name: Assert exact WP174 SDK pins and public imports
        run: |
          python -c "import importlib.metadata as m; assert m.version('polymarket-client') == '0.10.0'; assert m.version('websockets') == '15.0.1'"
          python -c "import polymarket; from polymarket import SecureClient, AsyncSecureClient; print('polymarket SDK imports OK')"

      - name: Focused WP168 offline-kernel tests (no Nautilus-required skip permitted)
        run: |
          set -o pipefail
          python -m pytest -rs -q \
            tests/research_runtime/nautilus_offline \
            tests/test_nautilus_offline_kernel_contract_docs.py \
            | tee "$RUNNER_TEMP/wp168_focused.txt"
          if grep -Eq "[0-9]+ skipped" "$RUNNER_TEMP/wp168_focused.txt"; then
            echo "::error::A WP168 offline-kernel test was skipped under strict hosted CI"
            exit 1
          fi

      - name: Focused WP167 tests (DuckDB strict, no skips permitted)
        run: |
          set -o pipefail
          # Write the captured output outside the repository so it does not appear
          # as an untracked file to the branch-scope governance guards run later.
          python -m pytest -rs -q \
            tests/data_layer/analytical_research \
            tests/test_analytical_research_layer_contract_docs.py \
            | tee "$RUNNER_TEMP/wp167_focused.txt"
          if grep -Eq "[0-9]+ skipped" "$RUNNER_TEMP/wp167_focused.txt"; then
            echo "::error::A WP167 analytical test was skipped under strict hosted CI"
            exit 1
          fi

      - name: Focused WP169 public market-truth tests (no skips permitted)
        run: |
          set -o pipefail
          python -c "import importlib.metadata as m; assert m.version('websockets') == '15.0.1', m.version('websockets')"
          python -m pytest -rs -q             tests/data_layer/polymarket/test_market_truth_models_store.py             tests/data_layer/polymarket/test_market_truth_websocket.py             tests/data_layer/polymarket/test_market_truth_data_api.py             tests/data_layer/polymarket/test_market_truth_onchain.py             tests/data_layer/polymarket/test_market_truth_runtime.py             tests/test_public_market_truth_realtime_data_plane_contract_docs.py             | tee "$RUNNER_TEMP/wp169_focused.txt"
          if grep -Eq "[0-9]+ skipped" "$RUNNER_TEMP/wp169_focused.txt"; then
            echo "::error::A WP169 market-truth test was skipped under strict hosted CI"
            exit 1
          fi

      - name: Focused WP170 experiment OS and registry tests (no skips permitted)
        run: |
          set -o pipefail
          python -m pytest -rs -q \
            tests/data_layer/analytical_research/test_experiment_os_identity.py \
            tests/data_layer/analytical_research/test_experiment_os_samples_splits.py \
            tests/data_layer/analytical_research/test_experiment_os_preregistration.py \
            tests/data_layer/analytical_research/test_experiment_os_lifecycle_evidence.py \
            tests/data_layer/analytical_research/test_experiment_registry.py \
            tests/data_layer/analytical_research/test_experiment_os_boundaries.py \
            tests/test_falsification_grade_experiment_registry_and_research_dataset_os_contract_docs.py \
            tests/tools/wp/test_wp_readiness_gate.py \
            | tee "$RUNNER_TEMP/wp170_focused.txt"
          if grep -Eq "[0-9]+ skipped" "$RUNNER_TEMP/wp170_focused.txt"; then
            echo "::error::A WP170 experiment OS test was skipped under strict hosted CI"
            exit 1
          fi

      - name: Focused WP171 read-only operator cockpit tests
        run: python -m pytest -q tests/test_operator_cockpit.py

      - name: Generated artifact guard
        run: python tools/git/preflight_generated_artifact_guard.py

      - name: Full test suite
        run: python -m pytest -q

  dependency-audit:
    name: dependency-audit (ubuntu-24.04 / py3.12)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact dependency pins and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install $WP167_DEPS $WP168_DEP $WP174_DEPS $WP171_DEPS "pytest>=8.0" pip-audit

      - name: pip check
        run: python -m pip check

      - name: pip-audit resolved environment
        run: python -m pip_audit

  ndfd-grib-compat:
    # S10-NDFD-GRIB-01 optional NDFD GRIB2 decoder capability proof. Installs the base
    # dependency closure plus the exact `ndfd-grib` extra read from pyproject.toml, with
    # binary wheels only for the ecCodes family (no source build), and decodes the committed
    # official NDFD PoP12 fixture. No NDFD download, no secrets, no product API, no trading.
    name: ndfd-grib-compat (${{ matrix.os }} / py3.12)
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      NDFD_GRIB_STRICT: "1"
    steps:
      - name: Normalize line endings before checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install base closure plus exact ndfd-grib extra (binary ecCodes only)
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib; p = tomllib.load(open('pyproject.toml', 'rb'))['project']; print('\n'.join(p['dependencies'] + p['optional-dependencies']['ndfd-grib']))" > "$RUNNER_TEMP/ndfd_grib_requirements.txt"
          cat "$RUNNER_TEMP/ndfd_grib_requirements.txt"
          python -m pip install --only-binary=eccodes,eccodeslib,eckitlib -r "$RUNNER_TEMP/ndfd_grib_requirements.txt" "pytest>=8.0"

      - name: pip check
        run: python -m pip check

      - name: Assert exact installed ndfd-grib versions
        run: |
          python -c "import importlib.metadata as m, platform; assert m.version('eccodes') == '2.48.0', m.version('eccodes'); assert platform.system() == 'Windows' or m.version('eccodeslib') == '2.48.0.26'; print('eccodes', m.version('eccodes'))"

      - name: ecCodes selfcheck
        run: python -m eccodes selfcheck

      - name: Focused NDFD GRIB dependency tests (strict, no skips permitted)
        run: |
          set -o pipefail
          python -m pytest -rs -q \
            tests/data_layer/analytical_research/test_ndfd_grib_dependency_compatibility.py \
            tests/test_ndfd_grib_decoder_dependency_contract_docs.py \
            | tee "$RUNNER_TEMP/ndfd_grib_focused.txt"
          if grep -Eq "[0-9]+ skipped" "$RUNNER_TEMP/ndfd_grib_focused.txt"; then
            echo "::error::An NDFD GRIB dependency test was skipped under strict hosted CI"
            exit 1
          fi

  ndfd-grib-dependency-audit:
    name: ndfd-grib-dependency-audit (ubuntu-24.04 / py3.12)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install base closure plus exact ndfd-grib extra and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib; p = tomllib.load(open('pyproject.toml', 'rb'))['project']; print('\n'.join(p['dependencies'] + p['optional-dependencies']['ndfd-grib']))" > "$RUNNER_TEMP/ndfd_grib_requirements.txt"
          python -m pip install --only-binary=eccodes,eccodeslib,eckitlib -r "$RUNNER_TEMP/ndfd_grib_requirements.txt" "pytest>=8.0" pip-audit

      - name: pip check
        run: python -m pip check

      - name: pip-audit resolved ndfd-grib environment
        run: python -m pip_audit

  cockpit-frontend:
    name: cockpit-frontend (node 24.18.0)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24.18.0 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: src/operator_cockpit_frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: src/operator_cockpit_frontend
        run: npm ci

      - name: Typecheck
        working-directory: src/operator_cockpit_frontend
        run: npm run typecheck

      - name: Production build
        working-directory: src/operator_cockpit_frontend
        run: npm run build

      - name: High-severity dependency audit
        working-directory: src/operator_cockpit_frontend
        run: npm audit --audit-level=high
