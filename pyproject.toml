[project]
name = "polymarket-strategy-lab"
version = "0.1.0"
description = "Repo-first governance foundation for a deterministic Polymarket and Kalshi strategy lab."
requires-python = ">=3.12,<3.15"
dependencies = [
  "pyarrow==25.0.1",
  "duckdb==1.5.5",
  "polars==1.44.1",
  "nautilus_trader==1.231.0",
  "websockets==17.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
